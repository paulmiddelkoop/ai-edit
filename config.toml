# AI Edit settings and actions. This is the shipped default; to change it,
# copy it to ~/.config/ai-edit/config.toml and edit the copy. Settings you
# leave out keep these values. Actions you list replace these as a whole.

# The coding agent that rewrites: claude or codex. Left out, AI Edit follows
# the agent Omarchy is set to (omarchy default agent), or claude when that is
# one AI Edit does not support.
# agent = "codex"
# Model for actions that do not name one. Left out: sonnet for Claude (haiku
# and opus work too), gpt-6.1-sol for Codex (any model codex lists).
# model = "sonnet"
# Codex only: Fast mode, about half a second quicker per rewrite, at the cost
# of more of your plan's usage.
fast = true
# Show the result before pasting it; Shift with the letter does the opposite.
preview = true
# Show only the text; the letters keep working and ? shows the actions.
compact = false
# Width of the overlay.
width = 560
# Minutes without using AI Edit after which the agent process kept ready is
# stopped to free its memory (about 170 MB per model for Claude). The next rewrite then
# takes a few seconds longer. 0 keeps it ready all the time.
idle_timeout = 30

# An action needs a key (one lowercase letter), a label and an instruction.
# Optional: model, preview, and diff = false to show the result as plain text
# instead of what changed (right for translations). Write the instruction as
# you would to a careful editor: what to change, and what to leave alone.
# Rules that apply to every action (keep the language, no preamble, no em
# dashes) are already given.

[[action]]
key = "f"
label = "Fix"
instruction = """
Correct spelling, grammar and punctuation only. Keep the author's wording, \
tone, sentence structure and length exactly as they are: add nothing, \
remove nothing, smooth nothing. Keep the language of the text."""

[[action]]
key = "i"
label = "Improve"
instruction = """
Improve this text where it is muddled: untangle sentences, put the points \
in a logical order and remove repetition. Keep the author's voice, wording \
and tone, and every fact, request and commitment. Add nothing, do not \
flatten it into a corporate tone, and avoid typical AI phrasing. Keep the \
language of the text."""

[[action]]
key = "s"
label = "Shorten"
instruction = """
Make the text more concise: remove repetition and words that add nothing. \
Keep its meaning, key details, requests and commitments, and the author's \
voice and tone; do not make it abrupt or turn it into notes. Add nothing. \
If it is already concise, leave it as it is. Keep the language of the text."""

[[action]]
key = "e"
label = "English"
diff = false
instruction = """
Translate the text into natural English, matching the register and tone of \
the original. Correct spelling and grammar on the way. If the text is \
already English, only correct its spelling and grammar."""
